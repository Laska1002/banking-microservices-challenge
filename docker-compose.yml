services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: banking
      RABBITMQ_DEFAULT_PASS: banking_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  customers-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customers_db
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d customers_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - customers-data:/var/lib/postgresql/data
      - ./database/customers.sql:/docker-entrypoint-initdb.d/01-customers.sql:ro

  accounts-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accounts_db
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking_dev
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d accounts_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - accounts-data:/var/lib/postgresql/data
      - ./database/accounts.sql:/docker-entrypoint-initdb.d/01-accounts.sql:ro

  customers-api:
    build:
      context: .
      dockerfile: src/Services/Customers/Customers.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CustomersDb: Host=customers-db;Port=5432;Database=customers_db;Username=banking;Password=banking_dev
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: banking
      RabbitMq__Password: banking_dev
    ports:
      - "8081:8080"
    depends_on:
      customers-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  accounts-api:
    build:
      context: .
      dockerfile: src/Services/Accounts/Accounts.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AccountsDb: Host=accounts-db;Port=5432;Database=accounts_db;Username=banking;Password=banking_dev
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: banking
      RabbitMq__Password: banking_dev
    ports:
      - "8082:8080"
    depends_on:
      accounts-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbitmq-data:
  customers-data:
  accounts-data:
